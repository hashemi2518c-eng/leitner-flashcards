<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Leitner Flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a3269"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Vazirmatn:wght@400;500&display=swap">
<style>
/* Layout: brand header with logo, then one working column. Practice shows a card with its heading, structure and answer; Setup maps sheet columns. */
:root{
  --navy:#1a3269; --navy-2:#0d214f; --green:#436659; --orange:#f7891b;
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16203A; --ink2:#586279; --line:#DAE0EA;
  --acc:#436659; --on-acc:#FFFFFF; --acc-soft:#E3EEE9; --acc-ink:#2F5144;
  --hard-soft:#FDEEDC; --hard-ink:#A4590A; --hard-line:#F2B77A;
  --err-soft:#FBE9E7; --err-ink:#B3382C;
  --bar1:#C9D3E6; --bar2:#9DB0D3; --bar3:#6F89BC; --bar4:#43609F; --bar5:#1a3269;
  --font-fa:'Vazirmatn','Yekan Bakh',system-ui,sans-serif; --font-en:'Poppins',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1222; --surface:#151E35; --ink:#E8ECF4; --ink2:#9AA5BA; --line:#27324D;
  --acc:#6C9E8B; --on-acc:#0B1220; --acc-soft:#17302A; --acc-ink:#9ACDB8;
  --hard-soft:#3A2A14; --hard-ink:#F6B26B; --hard-line:#7A4F1A;
  --err-soft:#3B1E1B; --err-ink:#F0877C;
  --bar1:#2A3858; --bar2:#34487A; --bar3:#42609F; --bar4:#5A7BC0; --bar5:#86A3DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1222; --surface:#151E35; --ink:#E8ECF4; --ink2:#9AA5BA; --line:#27324D;
  --acc:#6C9E8B; --on-acc:#0B1220; --acc-soft:#17302A; --acc-ink:#9ACDB8;
  --hard-soft:#3A2A14; --hard-ink:#F6B26B; --hard-line:#7A4F1A;
  --err-soft:#3B1E1B; --err-ink:#F0877C;
  --bar1:#2A3858; --bar2:#34487A; --bar3:#42609F; --bar4:#5A7BC0; --bar5:#86A3DC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-fa);font-size:15px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:520px;margin:0 auto}
.bar{background:var(--navy);color:#fff;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 16px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--orange)}
.logo{width:56px;height:56px;flex:none;display:block}
.ttl{flex:1;min-width:0}
.bar h1{font-size:17px;font-weight:500;margin:0;line-height:1.4}
.bar small{display:block;font-family:var(--font-en);font-size:11px;opacity:.75;letter-spacing:.02em}
.nav{display:flex;gap:6px;flex:none}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--navy);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;font-weight:500;margin:0 0 8px}
.muted{color:var(--ink2);font-size:13px;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
button,select,input{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:500}
.btn.hard{background:var(--hard-soft);border-color:var(--hard-line);color:var(--hard-ink)}
.btn.known{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{min-height:44px;padding:0 14px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.fil:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input[type=text],input[type=number],select{min-height:44px;width:100%;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ltr{direction:ltr;text-align:left;font-family:var(--font-en)}
.tab{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tabhead{display:flex;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stat{background:var(--bg);border-radius:8px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;margin:14px 0 4px}
.bx{text-align:center;font-size:11px;color:var(--ink2)}
.bx i{display:block;border-radius:4px 4px 0 0;min-height:4px;margin:0 auto 4px;width:100%}
.bx b{display:block;font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.fils{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.fil{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px}
.fil[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--orange);transition:width .25s}
.card{padding:0;overflow:hidden}
.ch{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.tag{font-size:12px;border-radius:6px;padding:0 10px;background:var(--navy);color:#fff;line-height:24px}
.tag.cat{background:var(--acc-soft);color:var(--acc-ink)}
.tag.box{background:transparent;border:1px solid var(--line);color:var(--ink2);margin-inline-start:auto}
.cb{padding:20px 16px;display:grid;gap:14px;text-align:center}
.cb.ex{text-align:start}
.q{font-size:22px;font-weight:500;line-height:1.45;overflow-wrap:anywhere;font-family:var(--font-en)}
.cb.ex .q{font-size:17px}
.lab{font-size:11px;letter-spacing:.04em;color:var(--ink2);text-transform:uppercase;font-family:var(--font-en)}
.blk{border-radius:8px;padding:12px;background:var(--bg);text-align:start;overflow-wrap:anywhere;white-space:pre-wrap}
.blk.ans{background:var(--acc-soft);color:var(--acc-ink)}
.ans.en{font-family:var(--font-en);font-size:15px;line-height:1.7}
.back{font-size:20px;overflow-wrap:anywhere}
.msg{padding:12px;border-radius:8px;background:var(--err-soft);color:var(--err-ink);font-size:14px;margin-bottom:16px}
.msg.ok{background:var(--acc-soft);color:var(--acc-ink)}
.msg a{color:inherit;font-weight:500;text-decoration:underline}
svg.ic{width:18px;height:18px;flex:none}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;margin-top:8px}
.hrow small{color:var(--ink2)}
.le{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.le time{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.le .ok{color:var(--acc-ink)}.le .no{color:var(--hard-ink)}
.rh{font-size:13px;color:var(--ink2);margin:12px 0 2px}
</style>
</head>

function saveDoc(name,data){

}
function srcOf(sid){for(var i=0;i<S.cfg.sources.length;i++)if(S.cfg.sources[i].sid===sid)return S.cfg.sources[i];return null}
function ensureTabs(sid){
  if(S.tabsOk[sid])return Promise.resolve();
  var id=srcOf(sid).id;
  return call("get_spreadsheet",{spreadsheetId:id,fields:["sheets.properties.title"]}).then(function(p){
    var have={},reqs=[],hd=[];
    ((p&&p.sheets)||[]).forEach(function(sh){have[sh.properties.title]=1});
    if(!have.Leitner_Box){reqs.push({addSheet:{properties:{title:"Leitner_Box"}}});hd.push(["Leitner_Box!A1:F1",[["کارت","سرفصل","جعبه","مرور بعدی","آخرین مرور","شناسه"]]])}
    if(!have.Leitner_Log){reqs.push({addSheet:{properties:{title:"Leitner_Log"}}});hd.push(["Leitner_Log!A1:H1",[["تاریخ","ساعت","دوره","سرفصل","کارت","نتیجه","جعبه","نوع"]]])}
    var pr=reqs.length?call("update_spreadsheet",{spreadsheetId:id,requests:reqs}):Promise.resolve();
    return pr.then(function(){return hd.reduce(function(a,h){return a.then(function(){return call("update_values",{spreadsheetId:id,range:h[0],values:h[1]})})},Promise.resolve())});
  }).then(function(){S.tabsOk[sid]=1});
}
function syncSheet(sid){
  var sr=srcOf(sid);if(!sr||!sr.id)return Promise.resolve();
  return ensureTabs(sid).then(function(){
    var rows=[["کارت","سرفصل","جعبه","مرور بعدی","آخرین مرور","شناسه"]];
    S.cards.forEach(function(c){if(c.sid!==sid)return;var x=S.prog.p[c.id];rows.push([c.front,c.label,x?x[0]:"جدید",x?x[1]:"",x&&x[2]?x[2]:"",c.id])});
    return call("update_values",{spreadsheetId:sr.id,range:"Leitner_Box!A1:F"+rows.length,values:rows});
  }).then(function(){
    var lg=S.logBuf[sid]||[];if(!lg.length)return;S.logBuf[sid]=[];
    return call("append_values",{spreadsheetId:sr.id,range:"Leitner_Log!A1",values:lg});
  });
}

  if(S.cfg.sheetSync===false)return;
  Object.keys(S.dirty).forEach(function(sid){
    delete S.dirty[sid];

    });
  });
}

function rng(t,r){return "'"+t.replace(/'/g,"''")+"'!"+r}
var CODE="// Leitner Flashcards - Google Sheets bridge (paste into the sheet: Extensions > Apps Script)\nvar TOKEN = '__TOKEN__';\n\nfunction out(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction tabOf(ss, name, create) {\n  var sh = ss.getSheetByName(name);\n  if (!sh && create) sh = ss.insertSheet(name);\n  return sh;\n}\nfunction grow(sh, rows, cols) {\n  if (sh.getMaxRows() < rows) sh.insertRowsAfter(sh.getMaxRows(), rows - sh.getMaxRows());\n  if (sh.getMaxColumns() < cols) sh.insertColumnsAfter(sh.getMaxColumns(), cols - sh.getMaxColumns());\n}\nfunction pad(vals) {\n  var w = 1;\n  vals.forEach(function (r) { if (r.length > w) w = r.length; });\n  return vals.map(function (r) { var x = r.slice(); while (x.length < w) x.push(''); return x; });\n}\nfunction dataSheet() {\n  var ss = SpreadsheetApp.getActive();\n  return tabOf(ss, 'Leitner_Data', true);\n}\n\nfunction doGet() {\n  return ContentService.createTextOutput('Leitner bridge OK');\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  try {\n    var r = JSON.parse(e.postData.contents);\n    if (r.token !== TOKEN) return out({ error: 'token' });\n    var a = r.action;\n    if (a === 'ping') return out({ ok: 1 });\n    var WRITES = { ensure: 1, update: 1, append: 1, docSet: 1 };\n    if (WRITES[a]) lock.waitLock(30000);\n    var cache = {};\n    var open = function (id) { return cache[id] || (cache[id] = SpreadsheetApp.openById(id)); };\n\n    if (a === 'boot') {\n      var ds0 = dataSheet(), all0 = ds0.getLastRow() ? ds0.getDataRange().getValues() : [], res = {};\n      r.names.forEach(function (n) {\n        var ch = [];\n        all0.forEach(function (row) { if (row[0] === n) ch.push([+row[1], String(row[2])]); });\n        ch.sort(function (x, y) { return x[0] - y[0]; });\n        res[n] = ch.length ? JSON.parse(ch.map(function (c) { return c[1]; }).join('')) : null;\n      });\n      return out({ docs: res });\n    }\n    if (a === 'cards') {\n      var results = r.reqs.map(function (q) {\n        try {\n          var sh0 = open(q.id).getSheetByName(q.tab);\n          if (!sh0) return { error: 'notab' };\n          var lr = Math.min(1000, sh0.getLastRow()), lc = Math.min(26, sh0.getLastColumn());\n          return { values: lr && lc ? sh0.getRange(1, 1, lr, lc).getDisplayValues() : [] };\n        } catch (er) { return { error: String(er) }; }\n      });\n      return out({ results: results });\n    }\n\n    if (a === 'tabs') {\n      var s = open(r.id);\n      return out({ title: s.getName(), sheets: s.getSheets().map(function (x) { return x.getName(); }) });\n    }\n    if (a === 'values') {\n      var sh = tabOf(open(r.id), r.tab, false);\n      if (!sh) return out({ error: 'notab', message: 'tab not found' });\n      var m = /:([A-Z]+)(\\d+)$/.exec(r.range || '');\n      var maxRow = m ? +m[2] : 1000;\n      var v = sh.getLastRow() ? sh.getDataRange().getDisplayValues() : [];\n      v = v.slice(0, maxRow).map(function (row) { return row.slice(0, 26); });\n      return out({ values: v });\n    }\n    if (a === 'ensure') {\n      var ss = open(r.id);\n      r.titles.forEach(function (t) { tabOf(ss, t, true); });\n      return out({ ok: 1 });\n    }\n    if (a === 'update') {\n      var sh2 = tabOf(open(r.id), r.tab, true);\n      var vals = pad(r.values);\n      grow(sh2, vals.length, vals[0].length);\n      sh2.getRange(1, 1, vals.length, vals[0].length).setValues(vals);\n      return out({ ok: 1 });\n    }\n    if (a === 'append') {\n      var sh3 = tabOf(open(r.id), r.tab, true);\n      var vv = pad(r.values), start = sh3.getLastRow() + 1;\n      grow(sh3, start + vv.length - 1, vv[0].length);\n      sh3.getRange(start, 1, vv.length, vv[0].length).setValues(vv);\n      return out({ ok: 1 });\n    }\n    if (a === 'docGet') {\n      var ds = dataSheet(), all = ds.getLastRow() ? ds.getDataRange().getValues() : [], ch = [];\n      all.forEach(function (row) { if (row[0] === r.name) ch.push([+row[1], String(row[2])]); });\n      if (!ch.length) return out({ data: null });\n      ch.sort(function (x, y) { return x[0] - y[0]; });\n      return out({ data: JSON.parse(ch.map(function (c) { return c[1]; }).join('')) });\n    }\n    if (a === 'docSet') {\n      var d2 = dataSheet(), last = d2.getLastRow();\n      if (last) {\n        var col = d2.getRange(1, 1, last, 1).getValues();\n        for (var i = col.length - 1; i >= 0; i--) if (col[i][0] === r.name) d2.deleteRow(i + 1);\n      }\n      var js = JSON.stringify(r.data), rows = [];\n      for (var p = 0, k = 0; p < js.length; p += 40000, k++) rows.push([r.name, k, js.substr(p, 40000)]);\n      var st = d2.getLastRow() + 1;\n      grow(d2, st + rows.length - 1, 3);\n      d2.getRange(st, 1, rows.length, 3).setNumberFormat('@').setValues(rows);\n      return out({ ok: 1 });\n    }\n    return out({ error: 'action', message: 'unknown action' });\n  } catch (err) {\n    return out({ error: 'script', message: String(err) });\n  } finally {\n    try { lock.releaseLock(); } catch (x) {}\n  }\n}\n";
function lsGet(k){try{var v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getConn(){var c=lsGet("lt_conn");return c&&c.url&&c.token?c:null}
function api(action,p,tr){
  var cn=S.conn;if(!cn)return Promise.reject({code:"net"});
  var body=JSON.stringify(Object.assign({token:cn.token,action:action},p||{}));
  var RD={boot:1,cards:1,tabs:1,values:1,docGet:1,ping:1};
  return fetch(cn.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body,redirect:"follow"}).then(function(r){return r.text().then(function(t){return {st:r.status,t:t}})},function(e){throw {code:"net",message:String(e&&e.message||e)}}).then(function(o){
    var j;try{j=JSON.parse(o.t)}catch(x){throw {code:"html",message:"HTTP "+o.st+": "+o.t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,140)}}

  if(!finished)h+=(total||resume)?'<button class="btn go" id="start" style="width:100%">'+(resume?'ادامه تمرین':'شروع تمرین')+'</button>':'<p class="muted">امروز کارتی برای مرور نیست.</p>';
  if(s&&s.date===t&&!finished&&S.idx===0&&!s.rep&&s.ids&&s.ids.length)h+='<p style="margin:12px 0 0"><button class="btn sm" id="rebuild">ساخت دوباره با تعداد جدید</button></p>';
  var bc=boxCounts(),mx=Math.max.apply(null,bc.concat([1])),days=[1,2,4,7,14];
  h+='<div class="boxes" aria-label="Leitner boxes">'+bc.map(function(v,i){return '<div class="bx"><b>'+fa(v)+'</b><i style="height:'+Math.max(4,Math.round(48*v/mx))+'px;background:var(--bar'+(i+1)+')"></i>جعبه '+fa(i+1)+'<br>'+fa(days[i])+' روز</div>'}).join("")+'</div>';
  h+='</div>';
  app.innerHTML=h;
  var b=document.getElementById("start");if(b)b.onclick=startSession;
  var ag=document.getElementById("again");if(ag)ag.onclick=startRepeat;
  var rb=document.getElementById("rebuild");if(rb)rb.onclick=function(){resetSession();renderPractice()};
  [].forEach.call(app.querySelectorAll("[data-f]"),function(el){el.onclick=function(){
    var f=S.prog.filter||[],k=el.dataset.f;
    if(k==="*")f=[];else{var i=f.indexOf(k);if(i>=0)f.splice(i,1);else f.push(k)}
    S.prog.filter=f;resetSession();renderPractice();
  }});
}

function renderSetup(){
  var d=S.draft||(S.draft=JSON.parse(JSON.stringify(S.cfg))),h="";
  h+='<div class="panel"><h2>تعداد روزانه</h2><div class="grid2"><div><label class="f" for="np">تعداد کل کارت در روز</label><input type="number" id="np" min="1" max="200" value="'+S.cfg.perDay+'"></div><div><label class="f" for="rp">سقف کارت جدید (۰ = بدون سقف)</label><input type="number" id="rp" min="0" max="200" value="'+S.cfg.maxNew+'"></div></div><div style="margin-top:12px"><label class="f" for="rd">تعداد دوره در روز (هر دوره یک بار مرور کامل کارت‌های امروز)</label><input type="number" id="rd" min="1" max="10" value="'+(S.cfg.rounds||1)+'"></div><p class="muted" style="margin-top:8px">اول کارت‌های مرورِ سررسیدشده می‌آیند و بقیه‌ی تعداد کل با کارت جدید پر می‌شود.</p>';
  h+='<label class="tabhead" style="margin-top:12px"><input type="checkbox" id="as"'+(S.cfg.autoSpeak?" checked":"")+'><span>پخش خودکار تلفظ</span></label><label class="tabhead" style="margin-top:8px"><input type="checkbox" id="ss"'+(S.cfg.sheetSync!==false?" checked":"")+'><span>ذخیره‌ی جعبه‌ها و تاریخچه در خود Google Sheet (تب‌های Leitner_Box و Leitner_Log)</span></label><p class="muted" style="margin-top:8px">تعداد با تغییر همین‌جا اعمال می‌شود و تمرین امروزِ شروع‌نشده دوباره ساخته می‌شود.</p></div>';
  d.sources.forEach(function(s,i){
    h+='<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+esc(s.name||("منبع "+fa(i+1)))+'</h2><button class="btn sm" data-rm="'+i+'">حذف</button></div>';
    h+='<label class="f" for="in'+i+'" style="margin-top:8px">لینک یا شناسه‌ی Google Sheet</label><div class="row"><input type="text" class="ltr" id="in'+i+'" data-in="'+i+'" value="'+esc(s.input||"")+'" style="flex:1 1 200px"><button class="btn sm" data-ld="'+i+'">بارگذاری تب‌ها</button></div>';
    (s.tabs||[]).forEach(function(t,j){
      h+='<div class="tab"><label class="tabhead"><input type="checkbox" data-tg="'+i+'.'+j+'"'+(t.on?" checked":"")+'><span class="ltr">'+esc(t.title)+'</span></label>';
      if(t.on&&t.headers){
        var o=function(sel,none){return (none?'<option value="-1"'+(sel<0?" selected":"")+'>ندارد</option>':"")+t.headers.map(function(_,k){return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+esc(colName(k,t.headers))+'</option>'}).join("")};
        var id=i+"."+j;
        h+='<div><label class="f" for="lb'+id+'">سرفصل این تب (مثلاً تخصصی برق)</label><input type="text" id="lb'+id+'" data-lb="'+id+'" value="'+esc(t.label||t.title)+'"></div>';
        h+='<div class="grid2"><div><label class="f">روی کارت (سؤال یا کلمه)</label><select data-fc="'+id+'">'+o(t.front)+'</select></div><div><label class="f">پشت کارت (جواب)</label><select data-bc="'+id+'">'+o(t.back)+'</select></div></div>';
        h+='<div class="grid2"><div><label class="f">ستون ساختار (برای تمرین CELPIP)</label><select data-sc="'+id+'">'+o(t.struct==null?-1:t.struct,true)+'</select></div><div><label class="f">ستون سرفصل هر ردیف</label><select data-cc="'+id+'">'+o(t.cat==null?-1:t.cat,true)+'</select></div></div>';
        h+='<div class="grid2"><div><label class="f">ستون جمله‌ی مثال (انگلیسی)</label><select data-ex="'+id+'">'+o(t.ex==null?-1:t.ex,true)+'</select></div><div><label class="f">ستون ترجمه‌ی مثال (فارسی)</label><select data-xf="'+id+'">'+o(t.exfa==null?-1:t.exfa,true)+'</select></div></div>';
        h+='<div><label class="f">کدام طرف انگلیسی است و خوانده شود</label><select data-sp="'+id+'"><option value="front"'+((t.speak||"front")==="front"?" selected":"")+'>روی کارت</option><option value="back"'+(t.speak==="back"?" selected":"")+'>پشت کارت (جواب)</option></select></div>';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  if(d.sources.length<5)h+='<p><button class="btn" id="add">افزودن شیت ('+fa(d.sources.length)+' از '+fa(5)+')</button></p>';
  h+='<div class="panel"><h2>اتصال</h2><p class="muted ltr" style="word-break:break-all">'+esc(S.conn.url)+'</p><p style="margin-top:8px"><button class="btn sm" id="chg">تغییر اتصال</button></p></div>';
  h+='<button class="btn go" id="save" style="width:100%">ذخیره و شروع</button>';
  app.innerHTML=h;
  function cnt(){
    S.cfg.perDay=Math.max(1,Math.min(200,parseInt(document.getElementById("np").value,10)||1));
    S.cfg.maxNew=Math.max(0,Math.min(200,parseInt(document.getElementById("rp").value,10)||0));
    S.cfg.rounds=Math.max(1,Math.min(10,parseInt(document.getElementById("rd").value,10)||1));
    var s=S.prog.session,dy=S.prog.day;if((!s||S.idx===0)&&!(dy&&dy.rounds)){S.prog.session=null;S.prog.day=null;S.idx=0;saveDoc("progress",S.prog)}
    saveCfgSoon();
  }
  document.getElementById("np").oninput=cnt;document.getElementById("rp").oninput=cnt;document.getElementById("rd").oninput=cnt;
  document.getElementById("ss").onchange=function(){S.cfg.sheetSync=this.checked;saveCfgSoon()};
  document.getElementById("as").onchange=function(){S.cfg.autoSpeak=this.checked;saveCfgSoon()};
  var add=document.getElementById("add");
  if(add)add.onclick=function(){d.sources.push({sid:rid(),input:"",id:"",name:"",tabs:[]});renderSetup()};
  document.getElementById("save").onclick=saveSetup;
  document.getElementById("chg").onclick=function(){S.conn=null;try{localStorage.removeItem("lt_conn")}catch(e){}renderConnect()};
  var q=function(a){return [].slice.call(app.querySelectorAll("["+a+"]"))},pi=function(v){var p=v.split(".");return d.sources[+p[0]].tabs[+p[1]]};
  q("data-rm").forEach(function(b){b.onclick=function(){d.sources.splice(+b.dataset.rm,1);renderSetup()}});
  q("data-in").forEach(function(el){el.oninput=function(){d.sources[+el.dataset.in].input=el.value}});
  q("data-ld").forEach(function(b){b.onclick=function(){loadTabs(+b.dataset.ld,b)}});
  q("data-tg").forEach(function(el){el.onchange=function(){var p=el.dataset.tg.split("."),t=pi(el.dataset.tg);t.on=el.checked;if(el.checked&&!t.headers)loadHeaders(+p[0],+p[1]);else renderSetup()}});
  q("data-lb").forEach(function(el){el.oninput=function(){pi(el.dataset.lb).label=el.value}});
  q("data-fc").forEach(function(el){el.onchange=function(){pi(el.dataset.fc).front=+el.value}});
  q("data-bc").forEach(function(el){el.onchange=function(){pi(el.dataset.bc).back=+el.value}});
  q("data-sc").forEach(function(el){el.onchange=function(){var t=pi(el.dataset.sc);t.struct=+el.value;if(t.struct>=0)t.speak="back"}});
  q("data-cc").forEach(function(el){el.onchange=function(){pi(el.dataset.cc).cat=+el.value}});
  q("data-ex").forEach(function(el){el.onchange=function(){pi(el.dataset.ex).ex=+el.value}});
  q("data-xf").forEach(function(el){el.onchange=function(){pi(el.dataset.xf).exfa=+el.value}});
  q("data-sp").forEach(function(el){el.onchange=function(){pi(el.dataset.sp).speak=el.value}});
}
function renderHist(){
  var D=S.prog.days||{},ks=Object.keys(D).sort().reverse(),h='<div class="panel"><h2>تاریخچه‌ی مرور</h2>';
  if(S.hist){
    var d=S.hist,L=S.logs[d];
    h+='<p><button class="btn sm" id="hb">بازگشت به فهرست</button></p><div class="rh" style="margin-top:4px"><b>'+esc(fdate(d))+'</b></div>';
    if(L===undefined)h+='<p class="muted">در حال خواندن…</p>';
    else if(!L||!L.entries.length)h+='<p class="muted">برای این روز موردی ثبت نشده.</p>';
    else{
      var cur=0;
      L.entries.forEach(function(e){
        if(e.r!==cur){cur=e.r;h+='<div class="rh">دوره '+fa(cur)+(e.rp?' · مرور مجدد':'')+'</div>'}
        h+='<div class="le"><time>'+esc(e.t)+'</time><span class="'+(e.k?'ok':'no')+'">'+(e.k?'✓':'✗')+'</span><span dir="auto" style="flex:1">'+esc(e.f)+'</span><span class="muted" style="font-size:12px">'+esc(e.l||"")+' · ج'+fa(e.b)+'</span></div>';
      });
    }
    h+='</div>';app.innerHTML=h;
    document.getElementById("hb").onclick=function(){S.hist=null;renderHist()};
    return;
  }
  if(!ks.length)h+='<p class="muted">هنوز تمرینی ثبت نشده. بعد از اولین تمرین، هر روز اینجا می‌آید.</p>';
  ks.forEach(function(k){var x=D[k];h+='<button class="hrow" data-d="'+k+'"><span><b>'+esc(fdate(k))+'</b><br><small>'+fa(x.n)+' مرور · '+fa(x.k)+' بلد · '+fa(x.h)+' سخت</small></span><span class="tag">'+fa(x.r)+' دوره</span></button>'});
  h+='</div>';app.innerHTML=h;
  [].forEach.call(app.querySelectorAll("[data-d]"),function(el){el.onclick=function(){openDay(el.dataset.d)}});
}
function openDay(d){
  S.hist=d;
  if(S.logs[d]===undefined&&S.col){
    renderHist();
    S.col.doc("log_"+d).get().then(function(g){S.logs[d]=g.exists?g.data():null;if(S.hist===d&&S.view==="hist")renderHist()}).catch(function(){S.logs[d]=null;renderHist()});
  }else renderHist();
}
function loadTabs(i,btn){
  var s=S.draft.sources[i],id=sheetId(s.input);
  if(!id){note("لینک یا شناسه‌ی شیت معتبر نیست. لینک کامل را از Google Sheets کپی کن.");return}
  note("");btn.textContent="در حال خواندن…";
  call("get_spreadsheet",{spreadsheetId:id,fields:["properties.title","sheets.properties.title"]}).then(function(p){
    var old={};(s.tabs||[]).forEach(function(t){old[t.title]=t});
    s.id=id;s.name=(p.properties&&p.properties.title)||"";
    s.tabs=((p.sheets)||[]).map(function(sh){var t=sh.properties.title;return old[t]||{tid:rid(),title:t,label:t,on:false}});
    renderSetup();
  }).catch(function(e){note(errText(e));renderSetup()});
}
function loadHeaders(i,j){
  var s=S.draft.sources[i],t=s.tabs[j];
  call("get_values",{spreadsheetId:s.id,range:rng(t.title,"A1:Z1")}).then(function(p){
    var h=((p&&p.values&&p.values[0])||[]).map(function(x){return String(x)});
    var c=pickCols(h);t.headers=h;t.front=c.front;t.back=c.back;t.struct=c.struct;t.cat=c.cat;t.ex=c.ex;t.exfa=c.exfa;t.speak=c.struct>=0?"back":"front";if(!t.label)t.label=t.title;
    renderSetup();
  }).catch(function(e){t.on=false;note(errText(e));renderSetup()});
}
function saveSetup(){
  var d=S.draft,bad=false;
  d.sources=d.sources.filter(function(s){return s.id});
  d.sources.forEach(function(s){(s.tabs||[]).forEach(function(t){if(t.on&&!t.headers)bad=true})});
  if(bad){note("ستون‌های یکی از تب‌ها هنوز خوانده نشده. چند ثانیه صبر کن و دوباره ذخیره کن.");return}
  if(!d.sources.some(function(s){return s.tabs.some(function(t){return t.on})})){note("حداقل یک تب را انتخاب کن.");return}
  S.cfg.sources=JSON.parse(JSON.stringify(d.sources));S.draft=null;
  S.prog.session=null;S.prog.day=null;S.prog.filter=[];S.idx=0;
  clearTimeout(S.timer);
  saveDoc("config",S.cfg);saveDoc("progress",S.prog);
  note("تنظیمات ذخیره شد.",true);
  S.view="practice";loadCards();
}
function go(v){S.view=v;if(v==="setup"&&!S.draft)S.draft=JSON.parse(JSON.stringify(S.cfg));if(v==="practice"&&S.phase==="idle"&&!S.prog.session)S.show=false;note("");render()}
document.getElementById("nav-p").onclick=function(){go("practice")};
document.getElementById("nav-s").onclick=function(){go("setup")};
document.getElementById("nav-h").onclick=function(){S.hist=null;go("hist")};

function applyDocs(c,p,l){
  if(c)S.cfg={perDay:c.perDay!=null?c.perDay:10,maxNew:c.maxNew||0,rounds:c.rounds||1,sheetSync:c.sheetSync!==false,autoSpeak:c.autoSpeak!==false,sources:c.sources||[]};
  if(p)S.prog={p:p.p||{},session:p.session||null,filter:p.filter||[],day:p.day||null,days:p.days||{}};
  if(l)S.logs[today()]=l;
}
function startCards(){if(S.cfg.sources.length){loadCards()}else{S.view="setup";S.phase="idle";render()}}
function boot(){
  if(!S.conn)return;
  S.col={doc:mkDoc};S.docs.config=mkDoc("config");S.docs.progress=mkDoc("progress");
  var ld=logDoc(today()),names=["config","progress",ld];
  var lc=lsGet("lt_doc_config"),lp=lsGet("lt_doc_progress"),ll=lsGet("lt_doc_"+ld),local=!!lc;
  if(local){applyDocs(lc,lp,ll);S.phase="idle";startCards()}
  api("boot",{names:names}).then(function(r){
    var d=r.docs||{},rc=d.config,rp=d.progress,rl=d[ld];
    var newer=function(a,b){return a&&(!b||(a.ts||0)>(b.ts||0))};
    var useC=newer(rc,lc),useP=newer(rp,lp),useL=newer(rl,ll);
    if(useC)lsSet("lt_doc_config",rc);if(useP)lsSet("lt_doc_progress",rp);if(useL)lsSet("lt_doc_"+ld,rl);
    if(!local){applyDocs(rc,rp,rl);S.phase="idle";startCards();return}
    if((useC||useP||useL)&&!S.touched){applyDocs(useC?rc:null,useP?rp:null,useL?rl:null);if(useC)startCards();else render()}
  }).catch(function(e){
    if(local){note("به شیت وصل نشد؛ با نسخه‌ی ذخیره‌شده‌ی گوشی ادامه می‌دهی و بعداً همگام می‌شود.");return}
    S.phase="idle";app.innerHTML='<div class="panel"><h2>اتصال برقرار نشد</h2><p class="muted">'+esc(errText(e))+'</p><p style="margin-top:12px"><button class="btn go" id="rt">تلاش دوباره</button> <button class="btn sm" id="rc">تغییر اتصال</button></p></div>';
    document.getElementById("rt").onclick=function(){S.phase="boot";render();boot()};
    document.getElementById("rc").onclick=function(){S.conn=null;try{localStorage.removeItem("lt_conn")}catch(x){}renderConnect()}
  });
}
S.conn=getConn();
render();
boot();
})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
